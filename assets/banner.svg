<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <style>
      .t { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .m { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .glow { animation: pulse 6s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .7; } }
    </style>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity=".6"/>
  <circle class="glow" cx="1020" cy="80" r="180" fill="#a78bfa" opacity=".4" filter="url(#blur)"/>
  <circle class="glow" cx="900" cy="300" r="140" fill="#22d3ee" opacity=".35" filter="url(#blur)"/>
  <text x="80" y="110" class="m" font-size="18" fill="#22d3ee">~/byteclub-dev $ whoami</text>
  <text x="80" y="175" class="t" font-size="56" font-weight="800" fill="#f9fafb">Wesley Arias</text>
  <rect x="80" y="195" width="140" height="4" rx="2" fill="url(#accent)"/>
  <text x="80" y="240" class="t" font-size="24" fill="#cbd5e1">Web developer and co-founder of ByteClub Dev</text>
  <text x="80" y="275" class="m" font-size="16" fill="#94a3b8">E-commerce  /  Business sites  /  Costa Rica to worldwide<tspan class="cursor" fill="#22d3ee"> _</tspan></text>
</svg>
